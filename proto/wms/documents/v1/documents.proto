syntax = "proto3";

package wms.documents.v1;

service DocumentsService {
  rpc CreateImport(CreateDocumentRequest) returns (Document);
  rpc CreateExport(CreateDocumentRequest) returns (Document);
  rpc CreateSale(CreateDocumentRequest) returns (Document);
  rpc CreateTransfer(CreateDocumentRequest) returns (Document);
  rpc CreatePurchaseReturn(CreateDocumentRequest) returns (Document);
  rpc CreateSalesReturn(CreateDocumentRequest) returns (Document);
  rpc InspectQa(InspectQaRequest) returns (InspectQaResponse);
  rpc PostDocument(PostDocumentRequest) returns (PostDocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (Document);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  // Phase 7: Approve without stock movement
  rpc ApproveRequest(ApproveRequestRequest) returns (ApproveRequestResponse);
  // Phase 8: Sales reservation workflow
  rpc ReserveRequest(ReserveRequestRequest) returns (ReserveRequestResponse);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  // Phase 10: Execution confirmation
  rpc StartExecution(StartExecutionRequest) returns (StartExecutionResponse);
  rpc ConfirmExecution(ConfirmExecutionRequest) returns (ConfirmExecutionResponse);
  rpc CompleteRequest(CompleteRequestRequest) returns (CompleteRequestResponse);
  rpc RevertToInProgress(RevertToInProgressRequest) returns (RevertToInProgressResponse);
  // Phase 10: Wave, CycleCount & Packing
  rpc CreateWave(CreateWaveRequest) returns (WaveResponse);
  rpc GetWave(GetWaveRequest) returns (WaveResponse);
  rpc CreateCycleCount(CreateCycleCountRequest) returns (CycleCountResponse);
  rpc GetCycleCount(GetCycleCountRequest) returns (CycleCountResponse);
  rpc VerifyPacking(VerifyPackingRequest) returns (VerifyPackingResponse);
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  IMPORT = 1;
  EXPORT = 2;
  TRANSFER = 3;
  SALE = 4;
  PURCHASE_RETURN = 6;
  SALES_RETURN = 7;
}

message DocumentItem {
  int64 product_id = 1;
  int64 quantity = 2;
  double unit_price = 3;
  string lot_number = 4;
}

message Document {
  int64 document_id = 1;
  string doc_type = 2;
  string status = 3;
  int64 from_warehouse_id = 4;
  int64 to_warehouse_id = 5;
  int64 customer_id = 6;
  repeated DocumentItem items = 7;
  string created_by = 8;
  string approved_by = 9;
  string note = 10;
  string created_at = 11;
  string posted_at = 12;
  string transaction_type = 13;
  string reason_code = 14;
  string owner_id = 15;
}

message CreateDocumentRequest {
  // For IMPORT: use `to_warehouse_id`
  // For EXPORT/SALE: use `from_warehouse_id`
  // For TRANSFER: use both
  int64 from_warehouse_id = 1;
  int64 to_warehouse_id = 2;
  int64 customer_id = 3;
  repeated DocumentItem items = 4;
  string created_by = 5;
  string note = 6;
  string transaction_type = 7;
  string reason_code = 8;
}

message PostDocumentRequest {
  int64 document_id = 1;
  string approved_by = 2;
}

message PostDocumentResponse {
  string message = 1;
}

message GetDocumentRequest {
  int64 document_id = 1;
}

message ListDocumentsRequest {
  string doc_type = 1; // optional
  int64 page = 2;
  int64 page_size = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}

message DeleteDocumentRequest {
  int64 document_id = 1;
}

message DeleteDocumentResponse {
  string message = 1;
}

// Phase 7: Approve without stock movement
message ApproveRequestRequest {
  int64 document_id = 1;
  string approved_by = 2;
}

message ApproveRequestResponse {
  string message = 1;
}

// Phase 8: Sales reservation workflow
message ReserveRequestRequest {
  int64 document_id = 1;
}

message ReserveRequestResponse {
  string message = 1;
}

message ReleaseReservationRequest {
  int64 document_id = 1;
}

message ReleaseReservationResponse {
  string message = 1;
}

// Phase 10: Execution confirmation
message StartExecutionRequest {
  int64 document_id = 1;
}

message StartExecutionResponse {
  string message = 1;
}

message ConfirmExecutionRequest {
  int64 document_id = 1;
  repeated DocumentItem items = 2;
}

message ConfirmExecutionResponse {
  string message = 1;
}

message CompleteRequestRequest {
  int64 document_id = 1;
}

message CompleteRequestResponse {
  string message = 1;
}

message RevertToInProgressRequest {
  int64 document_id = 1;
}

message RevertToInProgressResponse {
  string message = 1;
}

message InspectQaRequest {
  int64 document_id = 1;
  string inspected_by = 2;
  bool passed = 3;
  string note = 4;
}

message InspectQaResponse {
  string message = 1;
  Document document = 2;
}

// Phase 10: Wave Picking
message CreateWaveRequest {
  string wave_id = 1;
  string carrier = 2;
  string dispatch_cutoff = 3;
  int32 max_orders = 4;
}

message GetWaveRequest {
  string wave_id = 1;
}

message WaveResponse {
  string wave_id = 1;
  string carrier = 2;
  string dispatch_cutoff = 3;
  int32 max_orders = 4;
  string status = 5;
  int32 order_count = 6;
  string created_at = 7;
}

// Phase 10: Cycle Counting
message CycleCountItemProto {
  string item_id = 1;
  int64 product_id = 2;
  string location_id = 3;
  int64 system_qty = 4;
  int64 counted_qty = 5;
  string lot_number = 6;
  double unit_cost = 7;
}

message CreateCycleCountRequest {
  string cycle_count_id = 1;
  int64 warehouse_id = 2;
  string title = 3;
  repeated CycleCountItemProto items = 4;
  string assigned_to = 5;
  int32 discrepancy_qty_threshold = 6;
  double discrepancy_value_threshold = 7;
  string created_by = 8;
  string note = 9;
}

message GetCycleCountRequest {
  string cycle_count_id = 1;
}

message CycleCountResponse {
  string cycle_count_id = 1;
  int64 warehouse_id = 2;
  string title = 3;
  string status = 4;
  string assigned_to = 5;
  int32 discrepancy_qty_threshold = 6;
  double discrepancy_value_threshold = 7;
  string created_by = 8;
  string note = 9;
  repeated CycleCountItemProto items = 10;
  string created_at = 11;
}

// Phase 10: Packing & Check-Weigher
message PackItemProto {
  string product_id = 1;
  string sku = 2;
  int32 quantity = 3;
  double unit_weight_g = 4;
}

message VerifyPackingRequest {
  string carton_id = 1;
  string order_id = 2;
  double measured_weight_g = 3;
  double packaging_tare_weight_g = 4;
  repeated PackItemProto items = 5;
  double override_tolerance_g = 6;
}

message VerifyPackingResponse {
  string carton_id = 1;
  double theoretical_weight_g = 2;
  double measured_weight_g = 3;
  double deviation_g = 4;
  bool is_valid = 5;
  double allowed_tolerance_g = 6;
  string message = 7;
  string status = 8;
}




